      broadcast: '&b&lFINAL PUSH! &fOverworld Expedition mencapai &b75%&f.'
      title: ''
      subtitle: ''
      commands: []

    '100':
      name: '&d&lExpedition Complete &8• &f100%'
      icon: OBSIDIAN
      lore:
        - '&7Point dan resource requirement'
        - '&7Overworld telah selesai.'
      broadcast: '&d&lMILESTONE COMPLETE! &fOverworld Expedition selesai sepenuhnya.'
      title: '&d&lEXPEDITION COMPLETE'
      subtitle: '&fThe Nether siap dibuka.'
