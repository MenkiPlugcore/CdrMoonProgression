# CdrMoonProgression v0.6.0
# Paper 1.21.11 / Java 21
#
# Progression TIDAK bertambah saat block dihancurkan.
# Player mengumpulkan resource lalu menyetorkannya melalui /progress.

progression:
  overworld:
    target: 50000
    deposit-items:
      COAL: 1
      RAW_COPPER: 1
      RAW_IRON: 3
      RAW_GOLD: 5
      REDSTONE: 1
      LAPIS_LAZULI: 1
      EMERALD: 8
      DIAMOND: 10
      OAK_LOG: 1
      SPRUCE_LOG: 1
      BIRCH_LOG: 1
      JUNGLE_LOG: 1
      ACACIA_LOG: 1
      DARK_OAK_LOG: 1
      MANGROVE_LOG: 1
      CHERRY_LOG: 1
    unlock-commands: []

  nether:
    target: 70000
    deposit-items:
      NETHERRACK: 1
      SOUL_SAND: 2
      SOUL_SOIL: 2
      QUARTZ: 4
      GOLD_NUGGET: 1
      BLACKSTONE: 2
      BASALT: 2
      BONE_BLOCK: 5
      GLOWSTONE_DUST: 1
      ANCIENT_DEBRIS: 25
    unlock-commands: []

# ============================================================
# MILESTONE REWARDS
# ============================================================
# Global milestone reward tetap dapat memakai console command otomatis.
# Ini berbeda dengan PERSONAL GOALS di bawah yang reward-nya MANUAL oleh admin.
# Placeholder tersedia di broadcast/title/subtitle/commands:
# {stage} {stage_key} {percent} {current} {target}
#
# false = saat upgrade dari v0.3, milestone yang sudah terlewati ditandai
# sebagai REWARDED tanpa mengeksekusi reward lama secara tiba-tiba.
milestones:
  reward-existing-progress-on-first-load: false

  overworld:
    '10':
      name: '&a&lSupply I &8• &f10%'
      icon: CHEST
      lore:
        - '&7Expedition mulai mendapatkan'
        - '&7pasokan yang stabil.'
      broadcast: '&a&lMILESTONE! &fOverworld Expedition mencapai &a10%&f.'
      title: ''
      subtitle: ''
      commands: []

    '25':
      name: '&e&lSupply II &8• &f25%'
      icon: IRON_INGOT
      lore:
        - '&7Seperempat kebutuhan expedition'
        - '&7sudah terkumpul.'
      broadcast: '&e&lMILESTONE! &fOverworld Expedition mencapai &e25%&f.'
      title: ''
      subtitle: ''
      commands: []

    '50':
      name: '&6&lHalfway &8• &f50%'
      icon: GOLD_INGOT
      lore:
        - '&7Setengah perjalanan menuju'
        - '&7The Nether telah selesai.'
      broadcast: '&6&lHALFWAY! &fOverworld Expedition mencapai &650%&f.'
      title: '&6&lEXPEDITION HALFWAY'
      subtitle: '&fOverworld Progress &6{percent}%'
      commands: []

    '75':
      name: '&b&lFinal Push &8• &f75%'
      icon: DIAMOND
      lore:
        - '&7Tinggal seperempat lagi menuju'
        - '&7pembukaan The Nether.'
      broadcast: '&b&lFINAL PUSH! &fOverworld Expedition mencapai &b75%&f.'
      title: ''
      subtitle: ''
      commands: []

    '100':
      name: '&d&lExpedition Complete &8• &f100%'
      icon: OBSIDIAN
      lore:
        - '&7Target Overworld selesai.'
        - '&7The Nether siap dibuka.'
      broadcast: '&d&lMILESTONE COMPLETE! &fOverworld Expedition mencapai &d100%&f.'
      title: '&d&l100% COMPLETE'
      subtitle: '&fThe Nether expedition objective selesai.'
      commands: []

  nether:
    '10':
      name: '&a&lNether Supply I &8• &f10%'
      icon: NETHERRACK
      lore:
        - '&7Supply Nether pertama'
        - '&7berhasil dikumpulkan.'
      broadcast: '&a&lMILESTONE! &fNether Expedition mencapai &a10%&f.'
      title: ''
      subtitle: ''
      commands: []

    '25':
      name: '&e&lNether Supply II &8• &f25%'
      icon: QUARTZ
      lore:
        - '&7Seperempat kebutuhan menuju'
        - '&7The End sudah terkumpul.'
      broadcast: '&e&lMILESTONE! &fNether Expedition mencapai &e25%&f.'
      title: ''
      subtitle: ''
