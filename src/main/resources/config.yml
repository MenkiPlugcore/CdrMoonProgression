# CdrMoonProgression v0.3.0
# Paper 1.21.11 / Java 21
#
# Progression TIDAK lagi bertambah saat block dihancurkan.
# Player mengumpulkan resource lalu menyetorkannya melalui /progress.

progression:
  overworld:
    target: 50000
    deposit-items:
      COAL: 1
      RAW_COPPER: 1
      RAW_IRON: 3
      RAW_GOLD: 5
      REDSTONE: 1
      LAPIS_LAZULI: 1
      EMERALD: 8
      DIAMOND: 10
      OAK_LOG: 1
      SPRUCE_LOG: 1
      BIRCH_LOG: 1
      JUNGLE_LOG: 1
      ACACIA_LOG: 1
      DARK_OAK_LOG: 1
      MANGROVE_LOG: 1
      CHERRY_LOG: 1
    unlock-commands: []

  nether:
    target: 70000
    deposit-items:
      NETHERRACK: 1
      SOUL_SAND: 2
      SOUL_SOIL: 2
      QUARTZ: 4
      GOLD_NUGGET: 1
      BLACKSTONE: 2
      BASALT: 2
      BONE_BLOCK: 5
      GLOWSTONE_DUST: 1
      ANCIENT_DEBRIS: 25
    unlock-commands: []

# Jika list kosong, plugin memakai World.Environment sebagai fallback.
# Isi nama world bila setup Multiverse/custom dimension ingin dibuat eksplisit.
worlds:
  overworld: []
  nether: []
  end: []

# Mencegah portal, command teleport, dan teleport plugin menuju dimension terkunci.
dimension-lock:
  enabled: true

messages:
  prefix: '&8[&bMoon Progress&8]&r '
  locked-nether: '&cNether masih terkunci! &7Progress Overworld: &f{current}/{target} &7({percent}%)'
  locked-end: '&cThe End masih terkunci! &7Progress Nether: &f{current}/{target} &7({percent}%)'
  unlock-broadcast: '&b&lDIMENSION UNLOCKED! &f{dimension} &7sekarang dapat diakses.'
  unlock-title: '&b&lDIMENSION UNLOCKED'
  unlock-subtitle: '&f{dimension} &7telah terbuka!'
