# ============================================================
# PERSONAL CONTRIBUTION GOALS
# ============================================================
# Reward personal TIDAK PERNAH diberikan otomatis oleh plugin.
# Saat goal tercapai, status menjadi PENDING REWARD.
# Admin memberi hadiah secara manual, lalu menandai goal sebagai REWARDED:
# /progressadmin goals reward <player> <overworld|nether> <goal>
#
# Untuk melihat antrean reward manual:
# /progressadmin goals pending [overworld|nether|all]
personal-goals:
  enabled: true

  overworld:
    '500':
