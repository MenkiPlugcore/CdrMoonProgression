# CdrMoonProgression v0.7.0
# Paper 1.21.11 / Java 21
#
# Progression TIDAK bertambah saat block dihancurkan.
# Player mengumpulkan resource lalu menyetorkannya melalui /progress.

progression:
  overworld:
    target: 50000
    deposit-items:
      COAL: 1
      RAW_COPPER: 1
      RAW_IRON: 3
      RAW_GOLD: 5
      REDSTONE: 1
      LAPIS_LAZULI: 1
      EMERALD: 8
      DIAMOND: 10
      OAK_LOG: 1
      SPRUCE_LOG: 1
      BIRCH_LOG: 1
      JUNGLE_LOG: 1
      ACACIA_LOG: 1
      DARK_OAK_LOG: 1
      MANGROVE_LOG: 1
      CHERRY_LOG: 1
    unlock-commands: []

  nether:
    target: 70000
    deposit-items:
      NETHERRACK: 1
      SOUL_SAND: 2
      SOUL_SOIL: 2
      QUARTZ: 4
      GOLD_NUGGET: 1
      BLACKSTONE: 2
      BASALT: 2
      BONE_BLOCK: 5
      GLOWSTONE_DUST: 1
      ANCIENT_DEBRIS: 25
    unlock-commands: []

# ============================================================
# RESOURCE REQUIREMENTS
# ============================================================
# Dimension baru terbuka jika:
# 1. target point stage tercapai, DAN
# 2. SEMUA resource requirement stage tercapai.
#
# Satu requirement boleh menerima beberapa material.
# Contoh logs di bawah menerima semua jenis overworld log ke counter yang sama.
#
# initialize-from-history: saat pertama upgrade ke v0.7, plugin mencoba
# membangun requirement progress dari history.yml (history sejak v0.5).
# Data deposit yang lebih tua dari history dapat dikoreksi via:
# /progressadmin requirements set <stage> <id> <amount>
resource-requirements:
  enabled: true
  initialize-from-history: true

  overworld:
    iron_supply:
      name: '&f&lIron Supply'
      icon: RAW_IRON
      target: 3000
      materials:
        - RAW_IRON

    gold_supply:
      name: '&6&lGold Supply'
      icon: RAW_GOLD
      target: 1000
      materials:
        - RAW_GOLD

    diamond_reserve:
      name: '&b&lDiamond Reserve'
      icon: DIAMOND
      target: 100
      materials:
        - DIAMOND

    timber_stockpile:
      name: '&a&lTimber Stockpile'
      icon: OAK_LOG
      target: 5000
      materials:
        - OAK_LOG
        - SPRUCE_LOG
        - BIRCH_LOG
        - JUNGLE_LOG
        - ACACIA_LOG
        - DARK_OAK_LOG
        - MANGROVE_LOG
        - CHERRY_LOG

  nether:
    netherrack_stockpile:
      name: '&c&lNetherrack Stockpile'
      icon: NETHERRACK
      target: 15000
      materials:
        - NETHERRACK

    soul_materials:
      name: '&7&lSoul Materials'
      icon: SOUL_SAND
      target: 3000
      materials:
        - SOUL_SAND
        - SOUL_SOIL

    quartz_supply:
      name: '&f&lQuartz Supply'
      icon: QUARTZ
      target: 3000
      materials:
        - QUARTZ

    dark_stone:
      name: '&8&lDark Stone Supply'
      icon: BLACKSTONE
      target: 3000
      materials:
        - BLACKSTONE
        - BASALT

    bone_stockpile:
      name: '&f&lBone Stockpile'
      icon: BONE_BLOCK
      target: 500
      materials:
        - BONE_BLOCK

    ancient_material:
      name: '&6&lAncient Material'
      icon: ANCIENT_DEBRIS
      target: 50
      materials:
        - ANCIENT_DEBRIS

# ============================================================
# MILESTONE REWARDS
# ============================================================
# Global milestone reward tetap dapat memakai console command otomatis.
# Ini berbeda dengan PERSONAL GOALS di bawah yang reward-nya MANUAL oleh admin.
# Placeholder tersedia di broadcast/title/subtitle/commands:
# {stage} {stage_key} {percent} {current} {target}
#
# Milestone 100% hanya dipicu setelah target point DAN seluruh resource
# requirement stage selesai.
#
# false = saat upgrade dari v0.3, milestone yang sudah terlewati ditandai
# sebagai REWARDED tanpa mengeksekusi reward lama secara tiba-tiba.
milestones:
  reward-existing-progress-on-first-load: false

  overworld:
    '10':
      name: '&a&lSupply I &8• &f10%'
      icon: CHEST
      lore:
        - '&7Expedition mulai mendapatkan'
        - '&7pasokan yang stabil.'
      broadcast: '&a&lMILESTONE! &fOverworld Expedition mencapai &a10%&f.'
      title: ''
      subtitle: ''
      commands: []

    '25':
      name: '&e&lSupply II &8• &f25%'
      icon: IRON_INGOT
      lore:
        - '&7Seperempat kebutuhan expedition'
        - '&7sudah terkumpul.'
      broadcast: '&e&lMILESTONE! &fOverworld Expedition mencapai &e25%&f.'
      title: ''
      subtitle: ''
      commands: []

    '50':
      name: '&6&lHalfway &8• &f50%'
      icon: GOLD_INGOT
      lore:
        - '&7Setengah target point menuju'
        - '&7The Nether telah selesai.'
      broadcast: '&6&lHALFWAY! &fOverworld Expedition mencapai &650%&f.'
      title: '&6&lEXPEDITION HALFWAY'
      subtitle: '&fOverworld Point Progress &6{percent}%'
      commands: []

    '75':
      name: '&b&lFinal Push &8• &f75%'
      icon: DIAMOND
      lore:
        - '&7Tinggal seperempat target point.'
