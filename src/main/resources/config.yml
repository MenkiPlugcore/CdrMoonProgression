# ============================================================
# PERSONAL CONTRIBUTION GOALS
# ============================================================
# Reward personal TIDAK PERNAH diberikan otomatis oleh plugin.
# Saat goal tercapai, status menjadi PENDING REWARD.
# Admin memberi hadiah secara manual, lalu menandai goal sebagai REWARDED:
# /progressadmin goals reward <player> <overworld|nether> <goal>
#
# Untuk melihat antrean reward manual:
# /progressadmin goals pending [overworld|nether|all]
personal-goals:
  enabled: true

  overworld:
    '500':
      name: '&a&lContributor I &8• &f500'
      icon: IRON_NUGGET
      lore:
        - '&7Kontribusi awal untuk'
        - '&7Overworld Expedition.'
    '1000':
      name: '&e&lContributor II &8• &f1,000'
      icon: IRON_INGOT
      lore:
        - '&7Kontribusi personal mulai'
        - '&7memberi dampak besar.'
    '2500':
      name: '&6&lContributor III &8• &f2,500'
      icon: GOLD_INGOT
      lore:
        - '&7Kontributor utama untuk'
        - '&7Overworld Expedition.'
    '5000':
      name: '&b&lContributor IV &8• &f5,000'
      icon: DIAMOND
      lore:
        - '&7Kontribusi tingkat tinggi.'
    '10000':
      name: '&d&lContributor Elite &8• &f10,000'
      icon: NETHER_STAR
      lore:
        - '&7Pencapaian kontribusi personal'
        - '&7tertinggi di stage Overworld.'

  nether:
    '500':
      name: '&a&lNether Contributor I &8• &f500'
      icon: NETHER_BRICK
      lore:
        - '&7Kontribusi awal untuk'
        - '&7Nether Expedition.'
    '1000':
      name: '&e&lNether Contributor II &8• &f1,000'
      icon: QUARTZ
      lore:
        - '&7Kontribusi stabil menuju'
        - '&7persiapan The End.'
    '2500':
      name: '&6&lNether Contributor III &8• &f2,500'
      icon: GOLD_INGOT
      lore:
        - '&7Kontributor utama stage Nether.'
    '5000':
      name: '&b&lNether Contributor IV &8• &f5,000'
      icon: ANCIENT_DEBRIS
      lore:
        - '&7Kontribusi tingkat tinggi'
        - '&7untuk membuka The End.'
    '10000':
      name: '&d&lNether Contributor Elite &8• &f10,000'
      icon: ENDER_EYE
      lore:
        - '&7Pencapaian kontribusi personal'
        - '&7tertinggi di stage Nether.'

# ============================================================
# CONTRIBUTION HISTORY
# ============================================================
# history.yml menyimpan audit trail setoran yang BERHASIL.
# max-entries membatasi file agar tidak tumbuh tanpa batas.
history:
  enabled: true
  max-entries: 1000
  timezone: 'Asia/Jakarta'

# Jika list kosong, plugin memakai World.Environment sebagai fallback.
# Isi nama world bila setup Multiverse/custom dimension ingin dibuat eksplisit.
worlds:
  overworld: []
  nether: []
  end: []

# Mencegah portal, command teleport, dan teleport plugin menuju dimension terkunci.
dimension-lock:
  enabled: true

messages:
  prefix: '&8[&bMoon Progress&8]&r '
  locked-nether: '&cNether masih terkunci! &7Progress Overworld: &f{current}/{target} &7({percent}%)'
  locked-end: '&cThe End masih terkunci! &7Progress Nether: &f{current}/{target} &7({percent}%)'
  unlock-broadcast: '&b&lDIMENSION UNLOCKED! &f{dimension} &7sekarang dapat diakses.'
  unlock-title: '&b&lDIMENSION UNLOCKED'
  unlock-subtitle: '&f{dimension} &7telah terbuka!'
