# ============================================================
# CONTRIBUTION HISTORY
# ============================================================
# history.yml menyimpan audit trail setoran yang BERHASIL.
# max-entries membatasi file agar tidak tumbuh tanpa batas.
history:
  enabled: true
  max-entries: 1000
  timezone: 'Asia/Jakarta'

# Jika list kosong, plugin memakai World.Environment sebagai fallback.
# Isi nama world bila setup Multiverse/custom dimension ingin dibuat eksplisit.
worlds:
  overworld: []
  nether: []
  end: []

# Mencegah portal, command teleport, dan teleport plugin menuju dimension terkunci.
dimension-lock:
  enabled: true

messages:
  prefix: '&8[&bMoon Progress&8]&r '
  locked-nether: '&cNether masih terkunci! &7Points: &f{current}/{target} &8• &7Requirements: &f{requirements_done}/{requirements_total}'
  locked-end: '&cThe End masih terkunci! &7Points: &f{current}/{target} &8• &7Requirements: &f{requirements_done}/{requirements_total}'
  unlock-broadcast: '&b&lDIMENSION UNLOCKED! &f{dimension} &7sekarang dapat diakses.'
  unlock-title: '&b&lDIMENSION UNLOCKED'
  unlock-subtitle: '&f{dimension} &7telah terbuka!'
