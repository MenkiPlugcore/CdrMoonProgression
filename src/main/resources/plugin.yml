name: CdrMoonProgression
version: 1.0.0
main: id.menki.cdrmoonprogression.CdrMoonProgressionPlugin
api-version: '1.21'
authors: [Cadera]
description: Dimension lock, community progression, personal contribution, and leaderboard for Moonsign.
softdepend: [PlaceholderAPI]

commands:
  progress:
    description: Buka GUI progression, kontribusi, requirements, leaderboard, milestone, history, dan personal goals.
    usage: /progress
    aliases: [dimprogress, moonprogress]
  progressadmin:
    description: Administrasi CdrMoonProgression.
    usage: /progressadmin <status|add|set|reset|unlock|lock|requirements|goals|reload|save>
    aliases: [pa, moonprogressadmin]
    permission: cdrmoonprogression.admin

permissions:
  cdrmoonprogression.admin:
    description: Akses penuh command admin progression.
    default: op
  cdrmoonprogression.bypass.dimension:
    description: Bypass dimension lock.
    default: op
